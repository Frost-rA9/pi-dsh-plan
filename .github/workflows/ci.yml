name: ci

# The plan skeleton has no platform-specific behavior: the command, state fold,
# and section assembly are the same on Linux and macOS, so both jobs run the
# full suite. The RPC check (`npm run e2e`) stays local: it needs a `pi`
# installation on PATH.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Declarations only: the extension ships no runtime dependencies (pi
      # supplies and aliases them at load time). The versions match the host
      # this was developed against; bumping them is how upstream API drift
      # shows up.
      - name: Install type-check declarations
        run: >-
          npm install --no-save --no-audit --no-fund
          typescript@6
          @types/node@24
          typebox@1.3.27
          @earendil-works/pi-coding-agent@1.0.0

      - name: Unit tests
        run: node --test tests/*.test.ts

      - name: Type check
        # Run the documented command, not tsc directly: the script is what
        # resolves the declarations, and CI is where its portability path is
        # exercised on a host with no pi installation.
        run: npm run check
